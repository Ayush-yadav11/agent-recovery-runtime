name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python3 -m pip install --user -e .

      - name: Lint with ruff
        run: python3 -m pip install --user ruff && ruff check agent_recovery tests

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Compile all sources
        run: python3 -m compileall -q agent_recovery tests examples

      - name: Secret scan
        run: |
          if grep -r -n -E 'ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{22}|BEGIN RSA PRIVATE KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY' \
            --exclude-dir=.git --exclude-dir=__pycache__ --exclude-dir=.venv .; then
            echo "Secret-like material found in the repository"
            exit 1
          fi

      - name: Git diff check
        run: git diff --check
