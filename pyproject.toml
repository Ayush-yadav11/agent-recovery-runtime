[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recovery-runtime"
version = "0.1.0"
description = "A small runtime for verifying and safely recovering AI agent tool actions."
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["agent_recovery*"]
